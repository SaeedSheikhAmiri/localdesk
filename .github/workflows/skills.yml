name: Skills security
on:
  pull_request:
    paths:
      - skills/**
      - scripts/scan-skill.sh
      - .skillspector-baseline.yaml
      - .github/workflows/skills.yml
  push:
    branches: [main]
    paths:
      - skills/**
      - scripts/scan-skill.sh
      - .skillspector-baseline.yaml
      - .github/workflows/skills.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: SkillSpector (static)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      # Pinned to SkillSpector v2.13.4; bump the commit SHA by hand after review.
      - name: Install pinned scanner
        run: |
          python -m pip install --disable-pip-version-check 'skillspector @ git+https://github.com/NVIDIA/skillspector.git@54824463814a0be01360792523ec7245a69190fc'
      - name: Scan skills without LLM egress
        run: sh scripts/scan-skill.sh skills
      - name: Smoke-test the pinned scanner and gate
        run: |
          smoke="$RUNNER_TEMP/smoke-skill"
          mkdir -p "$smoke"
          printf '# Smoke skill\n\nGenerated by CI; not part of the repository.\n' > "$smoke/SKILL.md"
          python -c "import sys;sys.path.insert(0,'app');import skill_gate;print(skill_gate.scan(sys.argv[1]))" "$smoke"
