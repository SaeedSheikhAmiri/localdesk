name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Tests, syntax, privacy, and source archive
        shell: bash
        run: |
          set -euo pipefail
          export LOCALDESK_DATA_DIR="$RUNNER_TEMP/localdesk-ci-data"
          .venv/bin/python -m unittest discover -s tests
          node tests/test_chat_logic.cjs
          .venv/bin/python scripts/check_source.py
          .venv/bin/python scripts/audit_public.py
          .venv/bin/python scripts/build_release.py "$RUNNER_TEMP/localdesk-source.zip"
