name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not attach secrets, real conversations, personal screenshots or unredacted logs. Security vulnerabilities need a private channel; see SECURITY.md."
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: macOS, Python, Ollama, OpenCode and LocalDesk versions
    validations:
      required: true
